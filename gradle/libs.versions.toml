# ───────────────────────────────────────────────────────────────────────────────
# Naming Conventions
# ───────────────────────────────────────────────────────────────────────────────
# - Avoid kebab-case or snake_case
#   e.g.
#       - ❌ compose-bom
#       - ❌ compose_bom
# - All version keys must use camelCase
#   e.g.
#       - ✅ composeBom
#       - ✅ coreKtx
# ───────────────────────────────────────────────────────────────────────────────
[versions]
    agp = "8.11.0"
    coil = "3.2.0"
    kotlin = "2.2.0"
    runtime = "1.8.3"
    googleServices = "4.4.3"
    ksp = "2.2.0-2.0.2"
    coreKtx = "1.16.0"
    coreSplashScreen = "1.1.0-rc01"
    compileSdk = "36"
    targetSdk = "36"
    minSdk = "26"
    junit = "4.13.2"
    junitVersion = "1.2.1"
    truth = "1.4.4"
    espressoCore = "3.6.1"
    activityCompose = "1.10.1"
    composeBom = "2025.06.01"
    appcompat = "1.7.1"
    material = "1.12.0"
    room = "2.7.2"
    securityCrypto = "1.1.0-beta01"
    sqlCipher = "4.9.0"
    timber = "5.0.1"
    paging = "2.6.1"
    paging-compose = "3.3.6"
    chucker = "4.1.0"
    kotlinxAtomicfu = "0.29.0"
    zeloryCompressor = "3.0.1"
    lightCompressor = "1.3.3"
    ucrop = "2.2.10"
    kotlinxDatetime = "0.6.2"
    ablyAndroid = "1.2.53"
    hilt = "2.56.2"
    hiltCompose = "1.2.0"
    constraintLayoutCompose = "1.1.1"
    retrofit = "3.0.0"
    okhttp = "5.0.0-alpha.16"
    mockk = "1.13.10"
    coroutinesTest = "1.10.2"
    androidxLifecycle = "2.9.1"
    androidxNavigationCompose = "2.9.0"
    accompanistPermissions = "0.37.3"
    accompanistPager = "0.36.0"
    libphonenumber = "9.0.8"
    kotlinxSerialization = "1.8.1"
    activityKtx = "1.10.1"
    firebaseBom = "33.10.0"
androidx-paging-runtime = "3.3.0"
pagingCommonAndroid = "3.3.6"
benchmarkTraceprocessorJvm = "1.4.0-beta02"

# ───────────────────────────────────────────────────────────────────────────────
# Libraries Naming Convention
# ───────────────────────────────────────────────────────────────────────────────
# Avoid camel case
# e.g.
#   - ❌ coreKtx or snake_case
#   - ❌ core_ktx
# All library aliases must use kebab-case
# Structure: group prefix + library name, joined by hyphens
# e.g.
#   - ✅ androidx-core-ktx = "androidx.core:core-ktx"
#   - ✅ coil-compose = "io.coil-kt:coil-compose"
# ───────────────────────────────────────────────────────────────────────────────
[libraries]
    # AndroidX
    androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
    androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashScreen" }
    androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
    androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
    androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
    androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigationCompose" }
    androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
    androidx-constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintLayoutCompose" }
    androidx-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
    androidx-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
    androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
    androidx-lifecycle-compiler = { module = "androidx.lifecycle:lifecycle-compiler", version.ref = "androidxLifecycle" }
    androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
    androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging-compose" }
    # Compose
    androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-beta", version.ref = "composeBom" }
    androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
    androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
    androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
    androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
    androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
    androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
    androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
    androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

    # Kotlinx
    kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinxAtomicfu" }
    kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
    kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

    # Coil
    coil-bom = { group = "io.coil-kt.coil3", name = "coil-bom", version.ref = "coil" }
    coil = { group = "io.coil-kt.coil3", name = "coil" }
    coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose" }
    coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp" }
    coil-network-cacheControl = { group = "io.coil-kt.coil3", name = "coil-network-cache-control" }

    # Material
    material = { group = "com.google.android.material", name = "material", version.ref = "material" }

    # Room
    room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
    room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
    room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

    # Security Crypto
    security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

    # SQL Cipher
    sql-cipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlCipher" }
    timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

    # Dagger-Hilt
    hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
    hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
    hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
    hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltCompose" }

    # Retrofit
    retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
    retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
    retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }

    # OkHttp
    okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
    okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

    # Chucker
    chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }
    chucker-noop = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chucker" }

    # Testing
    truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
    coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
    mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
    junit = { group = "junit", name = "junit", version.ref = "junit" }

    # Zelory compressor
    zelory-compressor = { module = "id.zelory:compressor", version.ref = "zeloryCompressor" }

    # Light compressor
    light-compressor = { module = "com.github.AbedElazizShe:LightCompressor", version.ref = "lightCompressor" }

    # UCrop
    ucrop = { module = "com.github.yalantis:ucrop", version.ref = "ucrop" }
paging = { module = "androidx.room:room-paging", version.ref = "paging" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "androidx-paging-runtime" }
    # Accompanist
    accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
    accompanist-pager = { module = "com.google.accompanist:accompanist-pager", version.ref = "accompanistPager" }
    accompanist-pager-indicator = { module = "com.google.accompanist:accompanist-pager-indicators", version.ref = "accompanistPager" }

    # Libphonenumber
    lib-phone-number = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }

    # Firebase
    firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
    firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

    # Ably
    ably = { module = "io.ably:ably-android", version.ref = "ablyAndroid" }
androidx-paging-common-android = { group = "androidx.paging", name = "paging-common-android", version.ref = "pagingCommonAndroid" }
androidx-benchmark-traceprocessor-jvm = { group = "androidx.benchmark", name = "benchmark-traceprocessor-jvm", version.ref = "benchmarkTraceprocessorJvm" }


# ... other libraries
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }
# ───────────────────────────────────────────────────────────────────────────────
# Plugins Naming Convention
# ───────────────────────────────────────────────────────────────────────────────
# Avoid camelCase or snake_case
# e.g.
#   - ❌ androidApplicationPlugin
#   - ❌ android_application_plugin
# Keep names short, descriptive, and consistent with the plugin ID when possible
# All plugin aliases must use kebab-case
# e.g.
#   - ✅ android-application = "com.android.application"
#   - ✅ hilt = "com.google.dagger.hilt.android"
# ───────────────────────────────────────────────────────────────────────────────
[plugins]
    android-application = { id = "com.android.application", version.ref = "agp" }
    android-library = { id = "com.android.library", version.ref = "agp" }
    kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
    kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
    ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
    hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
    compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
    room = { id = "androidx.room", version.ref = "room" }
    google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
